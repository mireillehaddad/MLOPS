# PIPELINE DEFINITION
# Name: credit-card-fraud-detection-randomforest
# Description: End-to-end MLOps pipeline for credit card fraud detection
# Inputs:
#    fraud_rate: float [Default: 0.025]
#    max_depth: int [Default: 10.0]
#    min_accuracy: float [Default: 0.9]
#    n_estimators: int [Default: 100.0]
#    num_samples: int [Default: 5000.0]
#    test_size: float [Default: 0.2]
components:
  comp-deploy-model:
    executorLabel: exec-deploy-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
      parameters:
        accuracy:
          parameterType: NUMBER_DOUBLE
        min_accuracy:
          defaultValue: 0.9
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      parameters:
        Output:
          parameterType: STRING
  comp-evaluate-model:
    executorLabel: exec-evaluate-model
    inputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
        test_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
      parameters:
        accuracy:
          parameterType: NUMBER_DOUBLE
        f1_score:
          parameterType: NUMBER_DOUBLE
        precision:
          parameterType: NUMBER_DOUBLE
        recall:
          parameterType: NUMBER_DOUBLE
  comp-generate-credit-card-data:
    executorLabel: exec-generate-credit-card-data
    inputDefinitions:
      parameters:
        fraud_rate:
          defaultValue: 0.025
          isOptional: true
          parameterType: NUMBER_DOUBLE
        num_samples:
          defaultValue: 5000.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-preprocess-data:
    executorLabel: exec-preprocess-data
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        apply_smote:
          defaultValue: true
          isOptional: true
          parameterType: BOOLEAN
        test_size:
          defaultValue: 0.2
          isOptional: true
          parameterType: NUMBER_DOUBLE
    outputDefinitions:
      artifacts:
        test_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
        train_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
  comp-train-model:
    executorLabel: exec-train-model
    inputDefinitions:
      artifacts:
        train_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        max_depth:
          defaultValue: 10.0
          isOptional: true
          parameterType: NUMBER_INTEGER
        n_estimators:
          defaultValue: 100.0
          isOptional: true
          parameterType: NUMBER_INTEGER
    outputDefinitions:
      artifacts:
        model:
          artifactType:
            schemaTitle: system.Model
            schemaVersion: 0.0.1
  comp-validate-data:
    executorLabel: exec-validate-data
    inputDefinitions:
      artifacts:
        dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
    outputDefinitions:
      artifacts:
        metrics:
          artifactType:
            schemaTitle: system.Metrics
            schemaVersion: 0.0.1
        validated_dataset:
          artifactType:
            schemaTitle: system.Dataset
            schemaVersion: 0.0.1
      parameters:
        num_records:
          parameterType: NUMBER_INTEGER
        validation_passed:
          parameterType: BOOLEAN
defaultPipelineRoot: gs://mlopstest-510202-vertex-pipelines/pipeline_root
deploymentSpec:
  executors:
    exec-deploy-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - deploy_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef deploy_model(\n    model: Input[Model],\n    accuracy: float,\n\
          \    min_accuracy: float = 0.90\n) -> str:\n    \"\"\"Deploy model if it\
          \ meets performance criteria.\"\"\"\n\n    if accuracy >= min_accuracy:\n\
          \        print(f\"   DEPLOYMENT APPROVED\")\n        print(f\"   - Accuracy:\
          \ {accuracy:.4f}\")\n        print(f\"   - Threshold: {min_accuracy:.4f}\"\
          )\n        print(f\"   - Model ready for production deployment\")\n    \
          \    return \"DEPLOYED\"\n    else:\n        print(f\"    DEPLOYMENT REJECTED\"\
          )\n        print(f\"   - Accuracy: {accuracy:.4f}\")\n        print(f\"\
          \   - Threshold: {min_accuracy:.4f}\")\n        print(f\"   - Model needs\
          \ improvement\")\n        return \"NOT_DEPLOYED\"\n\n"
        image: python:3.10
    exec-evaluate-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - evaluate_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'numpy'\
          \ 'scikit-learn' 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef evaluate_model(\n    model: Input[Model],\n    test_dataset:\
          \ Input[Dataset],\n    metrics: Output[Metrics]\n) -> NamedTuple('Outputs',\
          \ [('accuracy', float), ('precision', float), ('recall', float), ('f1_score',\
          \ float)]):\n    \"\"\"Evaluate model performance on test data.\"\"\"\n\
          \    import pandas as pd\n    import numpy as np\n    import joblib\n  \
          \  from sklearn.metrics import accuracy_score, precision_score, recall_score,\
          \ f1_score\n    from sklearn.metrics import classification_report, confusion_matrix\n\
          \    from collections import namedtuple\n\n    # Load model and test data\n\
          \    model_path = model.path\n    rf_model = joblib.load(model_path)\n \
          \   test_df = pd.read_csv(test_dataset.path)\n\n    X_test = test_df.drop('is_fraud',\
          \ axis=1)\n    y_test = test_df['is_fraud']\n\n    # Make predictions\n\
          \    y_pred = rf_model.predict(X_test)\n    y_pred_proba = rf_model.predict_proba(X_test)[:,\
          \ 1]\n\n    # Calculate metrics\n    accuracy = accuracy_score(y_test, y_pred)\
          \   # Example: TP + TN / Total\n    precision = precision_score(y_test,\
          \ y_pred)\n    recall = recall_score(y_test, y_pred)\n    f1 = f1_score(y_test,\
          \ y_pred)\n\n    # Log metrics\n    metrics.log_metric('accuracy', accuracy)\n\
          \    metrics.log_metric('precision', precision)\n    metrics.log_metric('recall',\
          \ recall)\n    metrics.log_metric('f1_score', f1)\n\n    # Confusion matrix\n\
          \    cm = confusion_matrix(y_test, y_pred)\n    tn, fp, fn, tp = cm.ravel()\n\
          \n    metrics.log_metric('true_negatives', float(tn))\n    metrics.log_metric('false_positives',\
          \ float(fp))\n    metrics.log_metric('false_negatives', float(fn))\n   \
          \ metrics.log_metric('true_positives', float(tp))\n\n    # Print results\n\
          \    print(f\" Model Evaluation Complete\")\n    print(f\"\\n Performance\
          \ Metrics:\")\n    print(f\"   - Accuracy:  {accuracy:.4f}\")\n    print(f\"\
          \   - Precision: {precision:.4f}\")\n    print(f\"   - Recall:    {recall:.4f}\"\
          )\n    print(f\"   - F1-Score:  {f1:.4f}\")\n    print(f\"\\n Confusion\
          \ Matrix:\")\n    print(f\"   - True Negatives:  {tn}\")\n    print(f\"\
          \   - False Positives: {fp}\")\n    print(f\"   - False Negatives: {fn}\"\
          )\n    print(f\"   - True Positives:  {tp}\")\n\n    outputs = namedtuple('Outputs',\
          \ ['accuracy', 'precision', 'recall', 'f1_score'])\n    return outputs(accuracy,\
          \ precision, recall, f1)\n\n"
        image: python:3.10
    exec-generate-credit-card-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - generate_credit_card_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'numpy'\
          \ 'scikit-learn'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef generate_credit_card_data(\n    dataset: Output[Dataset],\n \
          \   num_samples: int = 5000,\n    fraud_rate: float = 0.025\n):\n    \"\"\
          \"Generate synthetic credit card transaction data with fraud patterns.\"\
          \"\"\n    import pandas as pd\n    import numpy as np\n    from datetime\
          \ import datetime, timedelta\n\n    np.random.seed(42)\n\n    # Generate\
          \ transaction data\n    num_fraud = int(num_samples * fraud_rate)\n    num_legitimate\
          \ = num_samples - num_fraud\n\n    # Legitimate transactions\n    legitimate_amounts\
          \ = np.random.lognormal(mean=3.5, sigma=1.2, size=num_legitimate)\n    legitimate_amounts\
          \ = np.clip(legitimate_amounts, 1, 500)\n\n    # Fraudulent transactions\
          \ (typically unusual patterns)\n    fraud_amounts = np.concatenate([\n \
          \       np.random.uniform(500, 2000, size=num_fraud//2),  # High amounts\n\
          \        np.random.uniform(1, 10, size=num_fraud - num_fraud//2)  # Very\
          \ small amounts\n    ])\n\n    # Create DataFrame\n    data = {\n      \
          \  'amount': np.concatenate([legitimate_amounts, fraud_amounts]),\n    \
          \    'transaction_hour': np.concatenate([\n            np.random.choice(range(6,\
          \ 23), size=num_legitimate),  # Normal hours\n            np.random.choice(range(0,\
          \ 6), size=num_fraud)  # Late night fraud\n        ]),\n        'merchant_category':\
          \ np.concatenate([\n            np.random.choice(['grocery', 'restaurant',\
          \ 'gas', 'retail'], size=num_legitimate),\n            np.random.choice(['electronics',\
          \ 'jewelry', 'online'], size=num_fraud)\n        ]),\n        'distance_from_home':\
          \ np.concatenate([\n            np.random.exponential(scale=10, size=num_legitimate),\n\
          \            np.random.uniform(50, 500, size=num_fraud)\n        ]),\n \
          \       'days_since_last_transaction': np.concatenate([\n            np.random.poisson(lam=3,\
          \ size=num_legitimate),\n            np.random.uniform(0, 1, size=num_fraud)\n\
          \        ]),\n        'online_transaction': np.concatenate([\n         \
          \   np.random.choice([0, 1], size=num_legitimate, p=[0.7, 0.3]),\n     \
          \       np.random.choice([0, 1], size=num_fraud, p=[0.2, 0.8])\n       \
          \ ]),\n        'is_fraud': np.concatenate([\n            np.zeros(num_legitimate),\n\
          \            np.ones(num_fraud)\n        ])\n    }\n\n    df = pd.DataFrame(data)\n\
          \n    # Shuffle the data\n    df = df.sample(frac=1, random_state=42).reset_index(drop=True)\n\
          \n    # Add transaction IDs\n    df.insert(0, 'transaction_id', range(1,\
          \ len(df) + 1))\n\n    # Save to output\n    df.to_csv(dataset.path, index=False)\n\
          \n    print(f\"     Generated {len(df)} transactions\")\n    print(f\" \
          \  - Legitimate: {num_legitimate} ({num_legitimate/len(df)*100:.1f}%)\"\
          )\n    print(f\"   - Fraudulent: {num_fraud} ({num_fraud/len(df)*100:.1f}%)\"\
          )\n    print(f\"   - Saved to: {dataset.path}\")\n\n"
        image: python:3.10
        resources:
          cpuLimit: 1.0
          resourceCpuLimit: '1'
    exec-preprocess-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - preprocess_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'numpy'\
          \ 'scikit-learn' 'imbalanced-learn'  &&  python3 -m pip install --quiet\
          \ --no-warn-script-location 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5;\
          \ python_version<\"3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef preprocess_data(\n    dataset: Input[Dataset],\n    train_dataset:\
          \ Output[Dataset],\n    test_dataset: Output[Dataset],\n    test_size: float\
          \ = 0.2,\n    apply_smote: bool = True\n):\n    \"\"\"Preprocess data with\
          \ encoding, scaling, and SMOTE for class balance.\"\"\"\n    import pandas\
          \ as pd\n    import numpy as np\n    from sklearn.model_selection import\
          \ train_test_split\n    from sklearn.preprocessing import StandardScaler,\
          \ LabelEncoder\n    from imblearn.over_sampling import SMOTE\n\n    # Load\
          \ data\n    df = pd.read_csv(dataset.path)\n\n    # Feature engineering\n\
          \    df['amount_per_day'] = df['amount'] / (df['days_since_last_transaction']\
          \ + 1)\n    df['is_weekend_hour'] = ((df['transaction_hour'] < 6) | (df['transaction_hour']\
          \ > 22)).astype(int)\n\n    # Encode categorical features\n    le = LabelEncoder()\n\
          \    df['merchant_category_encoded'] = le.fit_transform(df['merchant_category'])\n\
          \n    # Select features\n    feature_cols = ['amount', 'transaction_hour',\
          \ 'distance_from_home', \n                   'days_since_last_transaction',\
          \ 'online_transaction',\n                   'merchant_category_encoded',\
          \ 'amount_per_day', 'is_weekend_hour']\n\n    X = df[feature_cols]\n   \
          \ y = df['is_fraud']\n\n    # Split data\n    X_train, X_test, y_train,\
          \ y_test = train_test_split(\n        X, y, test_size=test_size, random_state=42,\
          \ stratify=y\n    )\n\n    # Scale features\n    scaler = StandardScaler()\n\
          \    X_train_scaled = scaler.fit_transform(X_train)\n    X_test_scaled =\
          \ scaler.transform(X_test)\n\n    # Apply SMOTE to balance classes (training\
          \ only)\n    if apply_smote:\n        smote = SMOTE(random_state=42)\n \
          \       X_train_scaled, y_train = smote.fit_resample(X_train_scaled, y_train)\n\
          \        print(f\"   Applied SMOTE\")\n        print(f\"   - Original class\
          \ distribution: {dict(pd.Series(y).value_counts())}\")\n        print(f\"\
          \   - Resampled class distribution: {dict(pd.Series(y_train).value_counts())}\"\
          )\n\n    # Create DataFrames with scaled features\n    train_df = pd.DataFrame(X_train_scaled,\
          \ columns=feature_cols)\n    train_df['is_fraud'] = y_train.reset_index(drop=True)\n\
          \n    test_df = pd.DataFrame(X_test_scaled, columns=feature_cols)\n    test_df['is_fraud']\
          \ = y_test.reset_index(drop=True)\n\n    # Save datasets\n    train_df.to_csv(train_dataset.path,\
          \ index=False)\n    test_df.to_csv(test_dataset.path, index=False)\n\n \
          \   print(f\"   Preprocessing complete\")\n    print(f\"   - Training samples:\
          \ {len(train_df)}\")\n    print(f\"   - Testing samples: {len(test_df)}\"\
          )\n    print(f\"   - Features: {len(feature_cols)}\")\n\n"
        image: python:3.10
    exec-train-model:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - train_model
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'numpy'\
          \ 'scikit-learn' 'joblib'  &&  python3 -m pip install --quiet --no-warn-script-location\
          \ 'kfp==2.17.0' '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"\
          3.9\"' && \"$0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef train_model(\n    train_dataset: Input[Dataset],\n    model:\
          \ Output[Model],\n    n_estimators: int = 100,\n    max_depth: int = 10\n\
          ):\n    \"\"\"Train Random Forest classifier for fraud detection.\"\"\"\n\
          \    import pandas as pd\n    import numpy as np\n    from sklearn.ensemble\
          \ import RandomForestClassifier\n    import joblib\n\n    # Load training\
          \ data\n    train_df = pd.read_csv(train_dataset.path)\n\n    X_train =\
          \ train_df.drop('is_fraud', axis=1)\n    y_train = train_df['is_fraud']\n\
          \n    # Train model\n    print(f\" Training Random Forest...\")\n    print(f\"\
          \   - n_estimators: {n_estimators}\")\n    print(f\"   - max_depth: {max_depth}\"\
          )\n    print(f\"   - Training samples: {len(X_train)}\")\n\n    rf_model\
          \ = RandomForestClassifier(\n        n_estimators=n_estimators,\n      \
          \  max_depth=max_depth,\n        random_state=42,\n        n_jobs=-1,\n\
          \        class_weight='balanced'\n    )\n\n    rf_model.fit(X_train, y_train)\n\
          \n    # Save model\n    model_path = model.path\n    joblib.dump(rf_model,\
          \ model_path)\n\n    # Feature importance\n    feature_importance = pd.DataFrame({\n\
          \        'feature': X_train.columns,\n        'importance': rf_model.feature_importances_\n\
          \    }).sort_values('importance', ascending=False)\n\n    print(f\" Model\
          \ training complete\")\n    print(f\"\\n Feature Importance:\")\n    for\
          \ idx, row in feature_importance.head(5).iterrows():\n        print(f\"\
          \   {row['feature']}: {row['importance']:.4f}\")\n\n"
        image: python:3.10
    exec-validate-data:
      container:
        args:
        - --executor_input
        - '{{$}}'
        - --function_to_execute
        - validate_data
        command:
        - sh
        - -c
        - "\nif ! [ -x \"$(command -v pip)\" ]; then\n    python3 -m ensurepip ||\
          \ python3 -m ensurepip --user || apt-get install python3-pip\nfi\n\nPIP_DISABLE_PIP_VERSION_CHECK=1\
          \ python3 -m pip install --quiet --no-warn-script-location 'pandas' 'numpy'\
          \  &&  python3 -m pip install --quiet --no-warn-script-location 'kfp==2.17.0'\
          \ '--no-deps' 'typing-extensions>=3.7.4,<5; python_version<\"3.9\"' && \"\
          $0\" \"$@\"\n"
        - sh
        - -ec
        - 'program_path=$(mktemp -d)


          printf "%s" "$0" > "$program_path/ephemeral_component.py"

          _KFP_RUNTIME=true python3 -m kfp.dsl.executor_main                         --component_module_path                         "$program_path/ephemeral_component.py"                         "$@"

          '
        - "\nimport kfp\nfrom kfp import dsl\nfrom kfp.dsl import *\nfrom typing import\
          \ *\n\ndef validate_data(\n    dataset: Input[Dataset],\n    validated_dataset:\
          \ Output[Dataset],\n    metrics: Output[Metrics]\n) -> NamedTuple('Outputs',\
          \ [('validation_passed', bool), ('num_records', int)]):\n    \"\"\"Validate\
          \ data quality and schema.\"\"\"\n    import pandas as pd\n    from collections\
          \ import namedtuple\n\n    # Load data\n    df = pd.read_csv(dataset.path)\n\
          \n    # Validation checks\n    required_columns = ['transaction_id', 'amount',\
          \ 'transaction_hour', \n                       'merchant_category', 'distance_from_home',\
          \ \n                       'days_since_last_transaction', 'online_transaction',\
          \ 'is_fraud']\n\n    validation_passed = True\n    issues = []\n\n    #\
          \ Check 1: Required columns present\n    missing_cols = set(required_columns)\
          \ - set(df.columns)\n    if missing_cols:\n        issues.append(f\"Missing\
          \ columns: {missing_cols}\")\n        validation_passed = False\n\n    #\
          \ Check 2: No missing values\n    if df.isnull().sum().sum() > 0:\n    \
          \    issues.append(f\"Missing values found: {df.isnull().sum().to_dict()}\"\
          )\n        validation_passed = False\n\n    # Check 3: Valid data ranges\n\
          \    if (df['amount'] < 0).any():\n        issues.append(\"Negative amounts\
          \ found\")\n        validation_passed = False\n\n    if (df['transaction_hour']\
          \ < 0).any() or (df['transaction_hour'] > 23).any():\n        issues.append(\"\
          Invalid transaction hours\")\n        validation_passed = False\n\n    #\
          \ Check 4: Fraud ratio\n    fraud_rate = df['is_fraud'].mean()\n    if fraud_rate\
          \ < 0.01 or fraud_rate > 0.1:\n        issues.append(f\"Unusual fraud rate:\
          \ {fraud_rate:.2%}\")\n\n    # Log metrics\n    metrics.log_metric('total_records',\
          \ len(df))\n    metrics.log_metric('fraud_rate', fraud_rate)\n    metrics.log_metric('validation_passed',\
          \ 1.0 if validation_passed else 0.0)\n\n    if validation_passed:\n    \
          \    print(\" Data validation PASSED\")\n        print(f\"   - Total records:\
          \ {len(df)}\")\n        print(f\"   - Fraud rate: {fraud_rate:.2%}\")\n\
          \        df.to_csv(validated_dataset.path, index=False)\n    else:\n   \
          \     print(\" Data validation FAILED\")\n        for issue in issues:\n\
          \            print(f\"   - {issue}\")\n        raise ValueError(f\"Data\
          \ validation failed: {', '.join(issues)}\")\n\n    outputs = namedtuple('Outputs',\
          \ ['validation_passed', 'num_records'])\n    return outputs(validation_passed,\
          \ len(df))\n\n"
        image: python:3.10
pipelineInfo:
